<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective — Case Files</title>
<style>
  :root{
    --bg: #0a0d12;
    --bg-vignette: radial-gradient(ellipse at 50% -10%, #1b232d 0%, #0a0d12 55%);
    --panel: #131920;
    --panel-2: #1a222b;
    --cork: #4a3a29;
    --cork-dark: #33271b;
    --border: #2b3947;
    --border-soft: #202b36;
    --text: #dde6ee;
    --text-dim: #8ea0b0;
    --text-faint: #5c6c7a;
    --paper: #ece6d6;
    --paper-2: #ddd5bd;
    --ink: #23201a;
    --accent: #5fd4ff;
    --accent-dim: #1f4a5c;
    --accent-glow: rgba(95,212,255,0.35);
    --gold: #cba869;
    --red: #b23b3b;
    --red-glow: rgba(178,59,59,0.45);
    --green: #4fae82;
    --shadow: rgba(0,0,0,0.55);
    --radius: 10px;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-mono: 'Courier New', Courier, monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg-vignette), var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height:100vh;
    overflow-x:hidden;
  }
  #root{ min-height:100vh; display:flex; flex-direction:column; }

  ::selection{ background: var(--accent-dim); color:var(--text); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: var(--bg); }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:6px; }

  button{ font-family: inherit; cursor:pointer; }
  button:focus-visible, [tabindex]:focus-visible, .clickable:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  .app-shell{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width: 1180px;
    width:100%;
    margin: 0 auto;
    padding: 22px 20px 40px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{
    font-family: var(--font-display);
    letter-spacing: 0.06em;
    font-size: 1.15rem;
    color: var(--text);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .badge{
    width:30px; height:30px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dim) 70%);
    box-shadow: 0 0 14px var(--accent-glow);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:bold; color:#06141a; font-size:0.85rem;
  }
  .case-tag{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    border: 1px solid var(--border-soft);
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--panel);
  }

  .stepper{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom: 26px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .step{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .step-dot{
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:0.7rem;
    color: var(--text-faint);
    background: var(--panel);
    transition: all 0.4s ease;
  }
  .step.active .step-dot{
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .step.done .step-dot{
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .step-label{
    font-size:0.68rem;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color: var(--text-faint);
    white-space:nowrap;
  }
  .step.active .step-label{ color: var(--text); }
  .step-line{
    width:22px; height:1px;
    background: var(--border);
    flex-shrink:0;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px var(--shadow);
  }

  .intro-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex:1;
    text-align:center;
    padding: 40px 10px;
    animation: fadeUp 0.6s ease;
  }
  .intro-eyebrow{
    font-family: var(--font-mono);
    letter-spacing: 0.25em;
    text-transform:uppercase;
    font-size: 0.75rem;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .intro-title{
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0 0 14px;
    color: var(--text);
    text-shadow: 0 0 30px rgba(95,212,255,0.12);
  }
  .intro-sub{
    color: var(--text-dim);
    max-width: 520px;
    line-height:1.6;
    margin-bottom: 34px;
  }

  .folder{
    position:relative;
    width: min(360px, 86vw);
    height: 230px;
    margin-bottom: 34px;
    cursor:pointer;
    perspective: 1200px;
  }
  .folder-back{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--paper-2), var(--paper));
    border-radius: 4px 10px 10px 10px;
    box-shadow: 0 18px 40px var(--shadow);
  }
  .folder-tab{
    position:absolute;
    top:-16px; left:16px;
    width: 120px; height: 22px;
    background: var(--paper-2);
    border-radius: 4px 4px 0 0;
  }
  .folder-front{
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--paper), var(--paper-2));
    border-radius: 4px 10px 10px 10px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:flex-end;
    padding: 18px 20px;
    transform-origin: bottom;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .folder:hover .folder-front{
    transform: rotateX(-24deg) translateY(-6px);
    box-shadow: 0 30px 40px rgba(0,0,0,0.5);
  }
  .folder-stamp{
    font-family: var(--font-mono);
    color: var(--red);
    border: 2px solid var(--red);
    padding: 3px 10px;
    border-radius:3px;
    font-size:0.7rem;
    letter-spacing:0.15em;
    transform: rotate(-6deg);
    margin-bottom:10px;
    opacity:0.9;
  }
  .folder-name{
    font-family: var(--font-mono);
    color: var(--ink);
    font-size: 0.95rem;
    font-weight:bold;
  }
  .folder-hint{
    font-family: var(--font-mono);
    color: #6b6250;
    font-size: 0.68rem;
    margin-top:4px;
  }

  .btn{
    font-family: var(--font-mono);
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:0.78rem;
    padding: 12px 26px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    color: var(--accent);
    background: transparent;
    transition: all 0.25s ease;
  }
  .btn:hover{
    background: var(--accent);
    color: #071319;
    box-shadow: 0 0 22px var(--accent-glow);
  }
  .btn.danger{
    border-color: var(--red);
    color: var(--red);
  }
  .btn.danger:hover{
    background: var(--red);
    color: #1a0808;
    box-shadow: 0 0 22px var(--red-glow);
  }
  .btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    box-shadow:none;
    background:transparent;
    color: var(--text-faint);
    border-color: var(--border);
  }

  .brief-grid{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap:20px;
    animation: fadeUp 0.5s ease;
  }
  @media (max-width: 800px){ .brief-grid{ grid-template-columns: 1fr; } }

  .doc-page{
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--ink);
    border-radius: 4px;
    padding: 26px 26px 22px;
    box-shadow: 0 14px 34px var(--shadow), inset 0 0 60px rgba(0,0,0,0.06);
    position:relative;
  }
  .doc-page::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:4px;
    background: repeating-linear-gradient(180deg, #b7402c 0 10px, transparent 10px 20px);
    opacity:0.5;
    border-radius: 4px 0 0 4px;
  }
  .doc-header{
    font-family: var(--font-mono);
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8a7f66;
    display:flex; justify-content:space-between;
    border-bottom: 1px dashed #b7ac91;
    padding-bottom:10px;
    margin-bottom:16px;
  }
  .doc-title{
    font-family: var(--font-display);
    font-size:1.7rem;
    margin: 0 0 4px;
  }
  .doc-industry{
    font-family: var(--font-mono);
    font-size:0.78rem;
    color:#7c6f4f;
    margin-bottom:18px;
  }
  .doc-field{ margin-bottom:16px; }
  .doc-field-label{
    font-family: var(--font-mono);
    font-size:0.68rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#8a7f66;
    margin-bottom:4px;
  }
  .doc-field-value{
    font-size:0.95rem;
    line-height:1.55;
    color:#2b271f;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family: var(--font-mono);
    font-size:0.72rem;
    background: rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.15);
    padding: 5px 10px;
    border-radius: 20px;
    color:#3a3324;
  }

  .side-col{ display:flex; flex-direction:column; gap:18px; }
  .budget-card{ padding:22px; }
  .card-title{
    font-family: var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--text-faint);
    margin-bottom:16px;
  }
  .donut-wrap{ display:flex; align-items:center; gap:18px; }
  .donut{
    width:120px; height:120px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow: 0 0 24px rgba(0,0,0,0.4), inset 0 0 0 8px var(--panel);
    transition: background 1.2s ease;
  }
  .donut-legend{ flex:1; }
  .legend-row{
    display:flex; align-items:center; gap:8px;
    font-size:0.78rem; color: var(--text-dim);
    margin-bottom:7px;
  }
  .legend-swatch{ width:10px; height:10px; border-radius:2px; flex-shrink:0; }
  .legend-pct{ margin-left:auto; font-family:var(--font-mono); color: var(--text); }

  .next-row{ display:flex; justify-content:flex-end; margin-top:22px; gap:10px; }

  .board-outer{
    position:relative;
    border-radius: 14px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.03), transparent 40%),
      repeating-linear-gradient(0deg, var(--cork) 0px, var(--cork-dark) 2px, var(--cork) 4px),
      linear-gradient(160deg, var(--cork), var(--cork-dark));
    box-shadow: 0 20px 50px var(--shadow), inset 0 0 90px rgba(0,0,0,0.45);
    padding: 26px;
    min-height: 560px;
    overflow: hidden;
    animation: fadeUp 0.5s ease;
    border: 8px solid #241b12;
  }
  .board-instructions{
    font-family: var(--font-mono);
    font-size:0.72rem;
    color: rgba(255,255,255,0.55);
    text-align:center;
    margin-bottom:18px;
    letter-spacing:0.05em;
  }
  .board-surface{
    position:relative;
    width:100%;
    height: 520px;
  }
  .theory-pin{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2a2016, #150f0a);
    border: 2px dashed var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:0.58rem;
    color: var(--gold);
    text-align:center;
    line-height:1.2;
    z-index:2;
    box-shadow: 0 0 20px rgba(203,168,105,0.25);
    pointer-events:none;
  }
  .string-svg{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:1;
  }
  .string-line{
    stroke: var(--red);
    stroke-width: 1.6;
    opacity:0.75;
    filter: drop-shadow(0 0 3px rgba(178,59,59,0.6));
  }

  .note{
    position:absolute;
    width: 190px;
    padding: 14px 14px 16px;
    border-radius: 3px;
    cursor: grab;
    user-select:none;
    box-shadow: 0 10px 18px rgba(0,0,0,0.4);
    transition: box-shadow 0.2s ease;
    z-index: 3;
    touch-action: none;
  }
  .note:active{ cursor:grabbing; z-index: 20; }
  .note:hover{ box-shadow: 0 16px 26px rgba(0,0,0,0.5); }
  .note.investigated{ box-shadow: 0 0 0 2px var(--accent), 0 14px 26px rgba(0,0,0,0.5); }

  .pin{
    position:absolute;
    top:-9px; left:50%;
    transform:translateX(-50%);
    width:16px; height:16px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff9b9b, #8f1f1f);
    box-shadow: 0 3px 4px rgba(0,0,0,0.5);
    z-index:4;
  }
  .note.tone-b .pin{ background: radial-gradient(circle at 35% 30%, #9ed2ff, #1c6f96); }
  .note.tone-c .pin{ background: radial-gradient(circle at 35% 30%, #ffe08a, #a3781f); }
  .note.tone-d .pin{ background: radial-gradient(circle at 35% 30%, #b7f2c4, #2c7d4a); }

  .note-yellow{ background: linear-gradient(160deg,#f4e8a6,#e6d685); color:#3a3319; transform: rotate(-2deg); }
  .note-blue{ background: linear-gradient(160deg,#bfe3f2,#9ccbe0); color:#152833; transform: rotate(1.5deg); }
  .note-pink{ background: linear-gradient(160deg,#f3c9d6,#e5adbf); color:#3a1a24; transform: rotate(-1deg); }
  .note-green{ background: linear-gradient(160deg,#cfe9c9,#b3d9ab); color:#1c3117; transform: rotate(2deg); }

  .note-label{
    font-family: var(--font-mono);
    font-size:0.62rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.65;
    margin-bottom:6px;
  }
  .note-text{ font-family: var(--font-mono); font-size:0.78rem; line-height:1.4; }
  .note-flag{ position:absolute; bottom:8px; right:10px; font-size:0.9rem; }

  .modal-backdrop{
    position:fixed; inset:0;
    background: rgba(4,6,9,0.72);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    animation: fadeIn 0.25s ease;
    padding: 20px;
  }
  .modal-card{
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--ink);
    max-width: 480px;
    width:100%;
    border-radius:6px;
    padding: 28px 26px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
    animation: popIn 0.3s cubic-bezier(.2,.8,.2,1);
    position:relative;
  }
  .modal-eyebrow{
    font-family: var(--font-mono);
    font-size:0.68rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8a7f66;
    margin-bottom:10px;
  }
  .modal-title{ font-family: var(--font-display); font-size:1.3rem; margin:0 0 14px; }
  .modal-body{ font-size:0.95rem; line-height:1.6; color:#2b271f; }
  .modal-body ul{ margin:6px 0 0; padding-left:18px; }
  .modal-body li{ margin-bottom:6px; }
  .modal-close{
    position:absolute; top:14px; right:16px;
    background:none; border:none; font-size:1.1rem; color:#6b6250;
  }
  .modal-close:hover{ color:#2b271f; }

  .metric-bars{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .metric-row{ display:flex; align-items:center; gap:10px; }
  .metric-name{ width:92px; font-family:var(--font-mono); font-size:0.7rem; color:#5c5340; flex-shrink:0; }
  .metric-track{ flex:1; background: rgba(0,0,0,0.1); border-radius:6px; height:10px; overflow:hidden; }
  .metric-fill{ height:100%; border-radius:6px; width:0%; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .metric-val{ font-family:var(--font-mono); font-size:0.72rem; width:64px; text-align:right; color:#2b271f; flex-shrink:0; }

  .solve-wrap{ display:flex; flex-direction:column; align-items:center; animation: fadeUp 0.5s ease; }
  .solve-head{ text-align:center; max-width:600px; margin-bottom:26px; }
  .progress-note{ font-family: var(--font-mono); font-size:0.72rem; color: var(--text-faint); margin-top:8px; }
  .options-grid{ display:grid; gap:14px; width:100%; max-width: 640px; margin-bottom: 22px; }
  .option-card{
    text-align:left;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 16px 18px;
    color: var(--text-dim);
    font-size:0.92rem;
    line-height:1.5;
    transition: all 0.2s ease;
    display:flex; gap:12px; align-items:flex-start;
    width:100%;
  }
  .option-card:hover:not(:disabled){
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 18px var(--accent-glow);
    transform: translateX(3px);
  }
  .option-letter{
    font-family:var(--font-mono);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:0.78rem;
  }
  .option-card.correct{ border-color: var(--green); background: rgba(79,174,130,0.09); color: var(--text); }
  .option-card.correct .option-letter{ border-color: var(--green); color: var(--green); }
  .option-card.wrong{ border-color: var(--red); background: rgba(178,59,59,0.09); color: var(--text); }
  .option-card.wrong .option-letter{ border-color: var(--red); color: var(--red); }
  .option-card:disabled{ cursor:default; }

  .feedback-banner{
    font-family: var(--font-mono);
    font-size:0.85rem;
    padding: 12px 18px;
    border-radius:8px;
    margin-bottom:18px;
    max-width:640px;
    text-align:center;
    animation: fadeUp 0.3s ease;
  }
  .feedback-banner.good{ background: rgba(79,174,130,0.12); color: var(--green); border:1px solid var(--green); }
  .feedback-banner.bad{ background: rgba(178,59,59,0.12); color: #e08b8b; border:1px solid var(--red); }

  .closed-wrap{ flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative; }
  .stamp{
    font-family: var(--font-display);
    font-weight:bold;
    font-size: clamp(2.4rem, 8vw, 4.6rem);
    color: var(--red);
    border: 6px solid var(--red);
    padding: 10px 34px;
    border-radius: 10px;
    letter-spacing: 0.06em;
    transform: rotate(-8deg) scale(0.4);
    opacity:0;
    animation: stampIn 0.55s 0.15s cubic-bezier(.2,.9,.3,1.2) forwards;
    box-shadow: 0 0 40px var(--red-glow);
  }
  .closed-sub{
    font-family: var(--font-mono);
    color: var(--text-faint);
    margin-top: 22px;
    font-size:0.8rem;
    opacity:0;
    animation: fadeIn 0.6s 0.9s forwards;
  }

  .report-wrap{ animation: fadeUp 0.5s ease; }
  .report-hero{ text-align:center; margin-bottom: 28px; }
  .report-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  @media (max-width: 800px){ .report-grid{ grid-template-columns:1fr; } }
  .report-card{ padding: 24px; }
  .report-card h3{ font-family: var(--font-display); font-size:1.1rem; margin: 0 0 12px; color: var(--accent); }
  .report-card p, .report-card li{ color: var(--text-dim); font-size:0.92rem; line-height:1.65; }
  .report-card ul{ padding-left:20px; margin:0; }
  .report-card li{ margin-bottom:8px; }
  .score-ring-wrap{ display:flex; align-items:center; gap:20px; }
  .score-ring{
    width:100px; height:100px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: background 1.2s ease;
    box-shadow: inset 0 0 0 8px var(--panel);
  }
  .score-ring span{ font-family:var(--font-mono); font-size:1.1rem; color:var(--text); }
  .report-actions{ display:flex; justify-content:center; gap:14px; margin-top:30px; flex-wrap:wrap; }

var MISTAKE_POOL = CASES.map(function(c){ return c.mistake; });
var DONUT_COLORS = ["#5fd4ff", "#cba869", "#4fae82", "#b23b3b", "#8ea0b0"];
var NOTE_TONES = ["note-yellow", "note-blue", "note-pink", "note-green"];
var PIN_TONES = ["", "tone-b", "tone-c", "tone-d"];
var STEPS = ["Assigned", "Briefing", "Board", "Solve", "Closed", "Report"];
var STAGE_INDEX = { assign: 0, brief: 1, board: 2, solve: 3, closed: 4, report: 5 };

/* ======================= HELPERS ======================= */
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function escapeHtml(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function randomCase(){
  return CASES[Math.floor(Math.random() * CASES.length)];
}

function buildQuizOptions(caseObj){
  var distractPool = MISTAKE_POOL.filter(function(m){ return m !== caseObj.mistake; });
  var distractors = shuffle(distractPool).slice(0, 3);
  var options = shuffle([
    { text: caseObj.mistake, correct: true }
  ].concat(distractors.map(function(t){ return { text: t, correct: false }; })));
  return options;
}

function buildDonutGradient(budget){
  var acc = 0;
  var stops = budget.map(function(b, i){
    var start = acc;
    acc += b.pct;
    return DONUT_COLORS[i % DONUT_COLORS.length] + " " + start + "% " + acc + "%";
  });
  return "conic-gradient(" + stops.join(", ") + ")";
}

function metricWidth(name, val){
  var num = parseFloat(val);
  if(isNaN(num)) return 20;
  if(String(val).indexOf("$") !== -1) return Math.min(95, Math.max(15, num / 1500));
  return Math.min(95, Math.max(6, num * 12));
}

/* ======================= APP STATE ======================= */
var state = {
  caseObj: randomCase(),
  stage: "assign",
  investigated: {},        // map noteId -> true
  wasCorrect: false,
  positions: {},           // map noteId -> {x,y} for the current case's board
  quizOptions: null,
  quizAnswered: false,
  quizSelectedIndex: null
};

var root = document.getElementById("root");

/* ======================= SHELL / STEPPER ======================= */
function renderStepper(){
  var stageIdx = STAGE_INDEX[state.stage];
  var html = '<div class="stepper" aria-label="Case progress">';
  STEPS.forEach(function(label, i){
    var cls = "step " + (i < stageIdx ? "done" : (i === stageIdx ? "active" : ""));
    html += '<div class="' + cls + '"><div class="step-dot">' + (i < stageIdx ? "&#10003;" : (i + 1)) + '</div><div class="step-label">' + label + '</div></div>';
    if(i < STEPS.length - 1) html += '<div class="step-line"></div>';
  });
  html += '</div>';
  return html;
}

function noteDefsForCase(caseObj){
  var defs = [
    { id: "metrics", type: "metrics", label: "Campaign Metrics", title: "Campaign Metrics", preview: "Reach, CTR, engagement, conversions, sales." },
    { id: "comments", type: "comments", label: "Customer Comments", title: "Customer Comments", preview: caseObj.comments[0].slice(0, 46) + "…" },
    { id: "social", type: "social", label: "Social Performance", title: "Social Media Performance", preview: caseObj.social[0].platform + ": " + caseObj.social[0].stat }
  ];
  caseObj.clues.forEach(function(c, i){
    defs.push({ id: "clue-" + i, type: "clue", clueIndex: i, label: "Clue #" + (i + 1), title: "Supporting Clue #" + (i + 1), preview: c.slice(0, 46) + "…" });
  });
  return defs;
}

/* ======================= MAIN RENDER DISPATCH ======================= */
function render(){
  var html = '<div class="app-shell">';
  html += '<div class="brand-row"><div class="brand"><span class="badge">MD</span> Marketing Detective</div>';
  html += '<div class="case-tag">FILE ' + escapeHtml(state.caseObj.id) + '</div></div>';
  html += renderStepper();
  html += '<div id="stage-content"></div>';
  html += '<div class="footer-note">MARKETING DETECTIVE &middot; ' + CASES.length + ' CASES ON FILE &middot; TRAIN YOUR CAMPAIGN INSTINCTS</div>';
  html += '</div>';
  root.innerHTML = html;

  var content = document.getElementById("stage-content");
  if(state.stage === "assign") renderAssign(content);
  else if(state.stage === "brief") renderBrief(content);
  else if(state.stage === "board") renderBoard(content);
  else if(state.stage === "solve") renderSolve(content);
  else if(state.stage === "closed") renderClosed(content);
  else if(state.stage === "report") renderReport(content);
}

/* ======================= BOARD ======================= */
function renderBoard(container){
  var c = state.caseObj;
  var defs = noteDefsForCase(c);

  container.innerHTML =
    '<div class="board-outer">' +
      '<div class="board-instructions">&#128204; Drag the pinned notes around. Click one to examine it closely — the case file will remember what you\'ve reviewed.</div>' +
      '<div class="board-surface" id="board-surface">' +
        '<svg class="string-svg" id="string-svg"></svg>' +
        '<div class="theory-pin">CASE<br/>THEORY</div>' +
      '</div>' +
    '</div>' +
    '<div class="next-row">' +
      '<span class="progress-note" id="evidence-progress" style="margin-right:auto;align-self:center;"></span>' +
      '<button class="btn" id="to-solve-btn">I\'m Ready to Solve It &rarr;</button>' +
    '</div>';

  var surface = document.getElementById("board-surface");
  var svg = document.getElementById("string-svg");
  var noteEls = {};

  function updateProgress(){
    var count = Object.keys(state.investigated).length;
    document.getElementById("evidence-progress").textContent = count + " / " + defs.length + " pieces of evidence examined";
  }

  function ensurePositions(){
    var w = surface.clientWidth || 900;
    var cols = 3;
    var marginX = 40, marginY = 30;
    var cellW = (w - marginX * 2) / cols;
    defs.forEach(function(def, i){
      if(state.positions[def.id]) return;
      var col = i % cols;
      var row = Math.floor(i / cols);
      var jitterX = (Math.random() - 0.5) * 20;
      var jitterY = (Math.random() - 0.5) * 14;
      state.positions[def.id] = {
        x: marginX + col * cellW + jitterX,
        y: marginY + row * 170 + jitterY
      };
    });
  }
  ensurePositions();

  function recalcLines(){
    var boardRect = surface.getBoundingClientRect();
    var centerX = boardRect.width / 2;
    var centerY = boardRect.height / 2;
    var lineHtml = "";
    Object.keys(noteEls).forEach(function(id){
      if(!state.investigated[id]) return;
      var el = noteEls[id];
      if(!el) return;
      var r = el.getBoundingClientRect();
      var x = r.left - boardRect.left + r.width / 2;
      var y = r.top - boardRect.top + r.height / 2;
      lineHtml += '<line class="string-line" x1="' + x + '" y1="' + y + '" x2="' + centerX + '" y2="' + centerY + '"></line>';
    });
    svg.innerHTML = lineHtml;
  }

  function openModal(def){
    var body = "";
    if(def.type === "metrics"){
      var m = c.metrics;
      var rows = [
        { name: "Reach", val: m.reach, color: "var(--accent)" },
        { name: "CTR", val: m.ctr, color: "var(--gold)" },
        { name: "Engagement", val: m.engagement, color: "var(--green)" },
        { name: "Conversions", val: m.conversions, color: "var(--red)" },
        { name: "Sales", val: m.sales, color: "#8a6fd1" }
      ];
      body = '<div class="metric-bars">' + rows.map(function(r){
        return '<div class="metric-row"><div class="metric-name">' + r.name + '</div>' +
          '<div class="metric-track"><div class="metric-fill" data-target="' + metricWidth(r.name, r.val) + '" style="background:' + r.color + '"></div></div>' +
          '<div class="metric-val">' + escapeHtml(r.val) + '</div></div>';
      }).join("") + '</div>';
    } else if(def.type === "comments"){
      body = '<ul>' + c.comments.map(function(cm){ return '<li>&ldquo;' + escapeHtml(cm) + '&rdquo;</li>'; }).join("") + '</ul>';
    } else if(def.type === "social"){
      body = '<ul>' + c.social.map(function(s){ return '<li><strong>' + escapeHtml(s.platform) + ':</strong> ' + escapeHtml(s.stat) + ' &mdash; ' + escapeHtml(s.note) + '</li>'; }).join("") + '</ul>';
    } else if(def.type === "clue"){
      body = '<p>' + escapeHtml(c.clues[def.clueIndex]) + '</p>';
    }

    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<button class="modal-close" aria-label="Close">&#10005;</button>' +
        '<div class="modal-eyebrow">Evidence &mdash; ' + escapeHtml(def.label) + '</div>' +
        '<h3 class="modal-title">' + escapeHtml(def.title) + '</h3>' +
        '<div class="modal-body">' + body + '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    function close(){ if(backdrop.parentNode) backdrop.parentNode.removeChild(backdrop); }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    backdrop.querySelector(".modal-close").addEventListener("click", close);
    backdrop.querySelector(".modal-card").addEventListener("click", function(e){ e.stopPropagation(); });

    // animate metric bars if present
    setTimeout(function(){
      var fills = backdrop.querySelectorAll(".metric-fill");
      fills.forEach(function(f){ f.style.width = f.getAttribute("data-target") + "%"; });
    }, 60);
  }

  defs.forEach(function(def, i){
    var pos = state.positions[def.id];
    var toneClass = NOTE_TONES[i % 4] + " " + PIN_TONES[i % 4];
    var investigatedClass = state.investigated[def.id] ? " investigated" : "";
    var note = document.createElement("div");
    note.className = "note " + toneClass + investigatedClass;
    note.style.left = pos.x + "px";
    note.style.top = pos.y + "px";
    note.setAttribute("data-id", def.id);
    note.innerHTML =
      '<div class="pin"></div>' +
      '<div class="note-label">' + escapeHtml(def.label) + '</div>' +
      '<div class="note-text">' + escapeHtml(def.preview) + '</div>' +
      (state.investigated[def.id] ? '<div class="note-flag" title="Investigated">&#128269;</div>' : "");
    surface.appendChild(note);
    noteEls[def.id] = note;

    var dragging = false;
    var offsetX = 0, offsetY = 0;
    var startX = 0, startY = 0;

    note.addEventListener("pointerdown", function(e){
      var boardRect = surface.getBoundingClientRect();
      var p = state.positions[def.id];
      offsetX = e.clientX - boardRect.left - p.x;
      offsetY = e.clientY - boardRect.top - p.y;
      startX = e.clientX; startY = e.clientY;
      dragging = true;
      note.style.zIndex = 20;
      note.style.transition = "none";
      if(note.setPointerCapture){ try { note.setPointerCapture(e.pointerId); } catch(err){} }
    });

    note.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var boardRect = surface.getBoundingClientRect();
      var x = e.clientX - boardRect.left - offsetX;
      var y = e.clientY - boardRect.top - offsetY;
      x = Math.max(0, Math.min(boardRect.width - 190, x));
      y = Math.max(0, Math.min(boardRect.height - 130, y));
      state.positions[def.id] = { x: x, y: y };
      note.style.left = x + "px";
      note.style.top = y + "px";
      recalcLines();
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      note.style.zIndex = "";
      note.style.transition = "";
      var dist = Math.hypot(e.clientX - startX, e.clientY - startY);
      if(dist < 6){
        state.investigated[def.id] = true;
        note.classList.add("investigated");
        if(!note.querySelector(".note-flag")){
          var flag = document.createElement("div");
          flag.className = "note-flag";
          flag.title = "Investigated";
          flag.innerHTML = "&#128269;";
          note.appendChild(flag);
        }
        updateProgress();
        recalcLines();
        openModal(def);
      }
    }
    note.addEventListener("pointerup", endDrag);
    note.addEventListener("pointercancel", endDrag);
  });

  updateProgress();
  recalcLines();
  window.addEventListener("resize", recalcLines);

  document.getElementById("to-solve-btn").addEventListener("click", function(){
    window.removeEventListener("resize", recalcLines);
    state.stage = "solve";
    render();
  });
}

/* ======================= SOLVE ======================= */
function renderSolve(container){
  var c = state.caseObj;
  if(!state.quizOptions){
    state.quizOptions = buildQuizOptions(c);
    state.quizAnswered = false;
    state.quizSelectedIndex = null;
  }
  var totalEvidence = 3 + c.clues.length;
  var investigatedCount = Object.keys(state.investigated).length;

  function optionsHtml(){
    return state.quizOptions.map(function(opt, idx){
      var cls = "option-card";
      if(state.quizAnswered && opt.correct) cls += " correct";
      else if(state.quizAnswered && idx === state.quizSelectedIndex && !opt.correct) cls += " wrong";
      return '<button class="' + cls + '" data-idx="' + idx + '" ' + (state.quizAnswered ? "disabled" : "") + '>' +
        '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span><span>' + escapeHtml(opt.text) + '</span>' +
        '</button>';
    }).join("");
  }

  function feedbackHtml(){
    if(!state.quizAnswered) return "";
    var correctOpt = state.quizOptions.filter(function(o){ return o.correct; })[0];
    var wasCorrect = state.quizOptions[state.quizSelectedIndex] && state.quizOptions[state.quizSelectedIndex].correct;
    if(wasCorrect){
      return '<div class="feedback-banner good">Correct deduction. The evidence lines up.</div>';
    }
    return '<div class="feedback-banner bad">Not quite &mdash; here\'s what the evidence actually points to:<div style="margin-top:6px;">' + escapeHtml(correctOpt.text) + '</div></div>';
  }

  function actionHtml(){
    if(!state.quizAnswered) return "";
    return '<button class="btn danger" id="close-case-btn">Close the Case</button>';
  }

  container.innerHTML =
    '<div class="solve-wrap">' +
      '<div class="solve-head">' +
        '<div class="intro-eyebrow">Final Deduction</div>' +
        '<h2 class="doc-title" style="color:var(--text);">What was the primary marketing mistake?</h2>' +
        '<div class="progress-note">You examined ' + investigatedCount + ' of ' + totalEvidence + ' pieces of evidence.</div>' +
      '</div>' +
      '<div class="options-grid" id="options-grid">' + optionsHtml() + '</div>' +
      '<div id="feedback-area">' + feedbackHtml() + '</div>' +
      '<div id="action-area">' + actionHtml() + '</div>' +
    '</div>';

  function attachOptionHandlers(){
    var buttons = container.querySelectorAll(".option-card");
    buttons.forEach(function(btn){
      btn.addEventListener("click", function(){
        if(state.quizAnswered) return;
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        state.quizSelectedIndex = idx;
        state.quizAnswered = true;
        document.getElementById("options-grid").innerHTML = optionsHtml();
        document.getElementById("feedback-area").innerHTML = feedbackHtml();
        document.getElementById("action-area").innerHTML = actionHtml();
        attachOptionHandlers();
        attachActionHandler();
      });
    });
  }
  function attachActionHandler(){
    var closeBtn = document.getElementById("close-case-btn");
    if(closeBtn){
      closeBtn.addEventListener("click", function(){
        var wasCorrect = state.quizOptions[state.quizSelectedIndex] && state.quizOptions[state.quizSelectedIndex].correct;
        state.wasCorrect = !!wasCorrect;
        state.stage = "closed";
        render();
      });
    }
  }
  attachOptionHandlers();
  attachActionHandler();
}

  var investigatedCount = Object.keys(state.investigated).length;
  var pct = Math.round((investigatedCount / totalEvidence) * 100);
  var ringColor = pct > 66 ? "var(--green)" : (pct > 33 ? "var(--gold)" : "var(--red)");

  var improvementsHtml = c.improvements.map(function(imp){ return '<li>' + escapeHtml(imp) + '</li>'; }).join("");

  container.innerHTML =
    '<div class="report-wrap">' +
      '<div class="report-hero">' +
        '<div class="intro-eyebrow">' + (state.wasCorrect ? "Case Solved" : "Case Reviewed") + '</div>' +
        '<h2 class="doc-title" style="color:var(--text);">Learning Report &mdash; ' + escapeHtml(c.company) + '</h2>' +
      '</div>' +
      '<div class="report-grid">' +
        '<div class="panel report-card"><h3>What Really Happened</h3><p>' + escapeHtml(c.explanation) + '</p></div>' +
        '<div class="panel report-card"><h3>Suggested Improvements</h3><ul>' + improvementsHtml + '</ul></div>' +
        '<div class="panel report-card"><h3>Investigation Thoroughness</h3>' +
          '<div class="score-ring-wrap">' +
            '<div class="score-ring" id="score-ring"><span>' + pct + '%</span></div>' +
            '<p style="margin:0;">You reviewed ' + investigatedCount + ' of ' + totalEvidence + ' pieces of evidence before making your deduction.' +
            (pct < 100 ? ' Examining every clue sharpens your instincts for the next case.' : ' Full evidence review — sharp work, detective.') + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="panel report-card"><h3>Case File Summary</h3><p><strong>Company:</strong> ' + escapeHtml(c.company) + '<br/><strong>Industry:</strong> ' + escapeHtml(c.industry) + '<br/><strong>Objective:</strong> ' + escapeHtml(c.objective) + '</p></div>' +
      '</div>' +
      '<div class="report-actions"><button class="btn" id="new-case-btn">Take the Next Case &rarr;</button></div>' +
    '</div>';

  setTimeout(function(){
    var ring = document.getElementById("score-ring");
    if(ring) ring.style.background = "conic-gradient(" + ringColor + " " + (pct * 3.6) + "deg, var(--panel-2) 0deg)";
  }, 100);

  document.getElementById("new-case-btn").addEventListener("click", function(){
    state.caseObj = randomCase();
    state.stage = "assign";
    state.investigated = {};
    state.wasCorrect = false;
    state.positions = {};
    state.quizOptions = null;
    state.quizAnswered = false;
    state.quizSelectedIndex = null;
    render();
  });
}

/* ======================= INIT ======================= */
render();

})();
</script>
</body>
</html>
