<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<style>
  :root{
    --bg:#0B0D12;
    --surface:#12151C;
    --surface-2:#171B24;
    --surface-3:#1E2330;
    --border:#272C39;
    --border-soft:#1E222C;
    --text:#F2F1ED;
    --text-dim:#9098AB;
    --text-faint:#5B6273;
    --accent:#FF6B35;
    --accent-soft:rgba(255,107,53,0.14);
    --accent-2:#4ECDC4;
    --accent-2-soft:rgba(78,205,196,0.14);
    --warn:#FFC857;
    --warn-soft:rgba(255,200,87,0.14);
    --bad:#FF5D6C;
    --bad-soft:rgba(255,93,108,0.14);
    --good:#59D48F;
    --good-soft:rgba(89,212,143,0.14);
    --radius:14px;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 550px at 12% -8%, rgba(255,107,53,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(78,205,196,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--accent);color:#1a0d05;}
  a{color:var(--accent-2);}

  .app{max-width:980px;margin:0 auto;padding:28px 20px 90px;}

  /* ---------- Topbar / Progress ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .brandmark{display:flex;align-items:center;gap:10px;}
  .brandmark .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .brandmark-text{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);}
  .restart-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .2s ease;
  }
  .restart-btn:hover{border-color:var(--bad);color:var(--bad);}

  .progress-wrap{margin:0 0 34px;}
  .progress-track{position:relative;display:flex;justify-content:space-between;padding:0 2px;}
  .progress-track::before{
    content:'';position:absolute;top:15px;left:16px;right:16px;height:2px;background:var(--border);z-index:0;
  }
  .progress-node-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .progress-node{
    width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;background:var(--bg);border:2px solid var(--border);color:var(--text-faint);
    transition:all .3s ease;
  }
  .progress-node.done{border-color:var(--accent-2);background:var(--accent-2-soft);color:var(--accent-2);}
  .progress-node.current{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft);}
  .progress-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);text-align:center;}
  .progress-label.active{color:var(--text-dim);}

  /* ---------- Stage container / motion ---------- */
  .stage{animation:fadeUp .45s ease both;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .stage{animation:none;}
  }

  .eyebrow{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:'';width:16px;height:1px;background:var(--accent);display:inline-block;}
  h1.title{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 12px;font-weight:800;letter-spacing:-.01em;}
  h2.subtitle{font-size:clamp(19px,2.6vw,24px);margin:0 0 8px;font-weight:700;letter-spacing:-.01em;}
  p.lede{color:var(--text-dim);font-size:15.5px;line-height:1.65;max-width:66ch;margin:0 0 22px;}

  /* ---------- Why box (what is this / why it matters) ---------- */
  .why-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 26px;}
  @media (max-width:640px){.why-grid{grid-template-columns:1fr;}}
  .why-box{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;}
  .why-box .wb-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px;}
  .why-box.what .wb-label{color:var(--accent-2);}
  .why-box.why .wb-label{color:var(--warn);}
  .why-box p{margin:0;font-size:14px;line-height:1.55;color:var(--text-dim);}

  /* ---------- Generic cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .card + .card{margin-top:16px;}

  .dossier{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:26px 24px 24px;margin-top:18px;}
  .dossier .tab{
    position:absolute;top:-13px;left:22px;background:var(--accent);color:#1a0d05;
    font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:5px 12px;border-radius:5px 5px 2px 2px;
  }
  .dossier h3{margin:6px 0 4px;font-size:21px;font-weight:800;}
  .dossier .dossier-sub{font-family:var(--mono);font-size:12px;color:var(--accent-2);margin:0 0 16px;letter-spacing:.03em;}
  .dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;}
  @media (max-width:640px){.dossier-grid{grid-template-columns:1fr;}}
  .dossier-field .df-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 5px;}
  .dossier-field p{margin:0;font-size:14px;line-height:1.55;color:var(--text);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{background:var(--surface-3);border:1px solid var(--border);color:var(--text-dim);font-size:12.5px;padding:4px 10px;border-radius:100px;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--sans);font-weight:600;font-size:14.5px;border-radius:10px;padding:12px 22px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;
    transition:all .18s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--text-faint);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1a0d05;}
  .btn-primary:hover:not(:disabled){background:#ff7c4d;}
  .btn-outline{background:transparent;border:1px solid var(--accent-2);color:var(--accent-2);}
  .btn-outline:hover:not(:disabled){background:var(--accent-2-soft);}
  .btn-ghost{background:transparent;border:1px dashed var(--border);color:var(--text-dim);}
  .btn-ghost:hover:not(:disabled){border-color:var(--text-dim);color:var(--text);}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}

  .actions-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center;}

  /* ---------- Mode select ---------- */
  .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  @media (max-width:760px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px 20px;cursor:pointer;transition:all .2s ease;text-align:left;
  }
  .mode-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 30px -12px rgba(255,107,53,.35);}
  .mode-card .mc-icon{font-size:30px;margin-bottom:12px;display:block;}
  .mode-card h3{margin:0 0 8px;font-size:17px;}
  .mode-card p{margin:0;color:var(--text-dim);font-size:13.5px;line-height:1.5;}

  /* ---------- Forms ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .field .hint{font-size:11.5px;color:var(--text-faint);margin-top:-2px;}
  input[type=text], textarea, select{
    background:var(--surface-3);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:11px 12px;font-family:var(--sans);font-size:14px;outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, textarea:focus, select:focus{border-color:var(--accent-2);}
  textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .toggle-row{display:flex;gap:10px;}
  .toggle-opt{flex:1;text-align:center;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-3);cursor:pointer;font-size:13.5px;color:var(--text-dim);transition:all .15s ease;}
  .toggle-opt.active{border-color:var(--accent-2);color:var(--accent-2);background:var(--accent-2-soft);}

  /* ---------- Platforms ---------- */
  .platform-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px;}
  @media (max-width:640px){.platform-grid{grid-template-columns:1fr;}}
  .platform-card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;
    transition:all .18s ease;position:relative;
  }
  .platform-card:hover{border-color:var(--text-faint);}
  .platform-card.selected{border-color:var(--accent);background:linear-gradient(180deg, var(--accent-soft), transparent 60%);}
  .platform-card .pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .platform-card .pc-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .platform-card .pc-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;}
  .platform-card.selected .pc-check{background:var(--accent);border-color:var(--accent);color:#1a0d05;}
  .platform-card p.pc-summary{margin:0 0 8px;font-size:13px;color:var(--text-dim);line-height:1.5;}
  .fit-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:100px;margin-bottom:6px;}
  .fit-badge.strong{background:var(--good-soft);color:var(--good);}
  .fit-badge.moderate{background:var(--warn-soft);color:var(--warn);}
  .fit-badge.weak{background:var(--bad-soft);color:var(--bad);}
  .fit-reason{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:0;}

  /* ---------- Pillars ---------- */
  .pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;}
  @media (max-width:760px){.pillar-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.pillar-grid{grid-template-columns:1fr;}}
  .pillar-card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;
    transition:all .18s ease;display:flex;flex-direction:column;gap:8px;
  }
  .pillar-card:hover:not(.disabled){border-color:var(--text-faint);}
  .pillar-card.selected{border-color:var(--accent-2);background:linear-gradient(180deg, var(--accent-2-soft), transparent 60%);}
  .pillar-card.disabled{opacity:.4;cursor:not-allowed;}
  .pillar-card .pnum{font-family:var(--mono);font-size:11px;color:var(--text-faint);}
  .pillar-card h4{margin:0;font-size:15px;}
  .pillar-card p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .goal-tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:100px;align-self:flex-start;}
  .pillar-select-count{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:14px;}
  .pillar-select-count b{color:var(--accent-2);}

  /* ---------- Roadmap ---------- */
  .roadmap-grid{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
  .week-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;gap:18px;}
  @media (max-width:600px){.week-card{flex-direction:column;gap:10px;}}
  .week-num{font-family:var(--mono);font-size:26px;font-weight:800;color:var(--accent);min-width:56px;}
  .week-num span{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;margin-top:2px;}
  .week-body h4{margin:0 0 4px;font-size:16px;}
  .week-body .week-goal{font-size:12.5px;color:var(--accent-2);margin:0 0 10px;font-style:italic;}
  .week-body ul{margin:0;padding-left:18px;}
  .week-body li{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-bottom:4px;}

  /* ---------- Event / curveball ---------- */
  .event-card{background:linear-gradient(180deg, var(--warn-soft), transparent 70%);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-top:18px;}
  .event-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:0 0 8px;}
  .event-desc{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .option-list{display:flex;flex-direction:column;gap:10px;}
  .option-btn{
    text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:13px 16px;cursor:pointer;font-size:14px;color:var(--text);transition:all .15s ease;
  }
  .option-btn:hover:not(:disabled){border-color:var(--accent);}
  .option-btn:disabled{cursor:default;}
  .option-btn.chosen{border-color:var(--accent-2);background:var(--accent-2-soft);}
  .consequence-box{margin-top:16px;padding:16px;border-radius:10px;background:var(--surface-3);border-left:3px solid var(--accent-2);}
  .consequence-box .cb-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin:0 0 6px;}
  .consequence-box p{margin:0;font-size:14px;line-height:1.6;color:var(--text);}

  /* ---------- Report ---------- */
  .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
  @media (max-width:700px){.report-grid{grid-template-columns:1fr;}}
  .report-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .report-card.full{grid-column:1/-1;}
  .report-card .rc-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2);margin:0 0 8px;}
  .report-card p{margin:0;font-size:14px;line-height:1.6;color:var(--text-dim);}
  .report-card ul{margin:6px 0 0;padding-left:18px;}
  .report-card li{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-bottom:4px;}
  .meter{height:10px;border-radius:100px;background:var(--surface-3);overflow:hidden;margin-top:10px;border:1px solid var(--border);}
  .meter-fill{height:100%;border-radius:100px;background:linear-gradient(90deg, var(--accent-2), var(--accent));transition:width 1s ease;}
  .growth-label{font-size:22px;font-weight:800;margin-top:10px;}
  .best-card{border-color:var(--good);}
  .best-card .rc-label{color:var(--good);}
  .mistake-card{border-color:var(--bad);}
  .mistake-card .rc-label{color:var(--bad);}
  .lessons-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .lessons-list li{display:flex;gap:10px;font-size:14px;color:var(--text);line-height:1.55;}
  .lessons-list .lnum{font-family:var(--mono);color:var(--accent);font-weight:700;}

  /* ---------- Ask Claude card ---------- */
  .ask-claude{margin-top:20px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .ask-claude-header{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-3);}
  .ask-claude-header .ac-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);}
  .ask-claude-header span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);}
  .ask-claude-body{padding:16px;}
  .ask-claude-body pre{
    margin:0 0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--accent-2);
    white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;padding:13px 14px;
  }
  .ask-claude-note{font-size:12px;color:var(--text-faint);margin:0 0 12px;line-height:1.5;}
  .copy-btn{font-family:var(--mono);}

  small.foot{display:block;text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:60px;font-family:var(--mono);letter-spacing:.04em;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

function strong(reason){ return { verdict:'Strong fit', reason }; }
function moderate(reason){ return { verdict:'Worth testing', reason }; }
function weak(reason){ return { verdict:'Low priority', reason }; }

function getPlatformFit(id, brand, mode){
  const t = brand.tags || {};
  const personal = mode === 'personal';
  const visual = !!t.visual, b2b = !!t.b2b, local = !!t.local, older = t.ageSkew === 'older';
  switch(id){
    case 'instagram':
      if(personal) return visual
        ? strong(`Your niche is visual enough that Instagram (Reels + carousels) can genuinely grow your audience, not just decorate a profile.`)
        : moderate(`Instagram rewards visuals more than expertise. Useful as a secondary channel, but it won't do the heavy lifting for a knowledge-based personal brand.`);
      return visual
        ? strong(`${brand.industryLabel} is a visual category — product shots and Reels are exactly what Instagram rewards.`)
        : moderate(`Instagram can still build awareness for ${brand.name}, but without strong visuals it will underperform text- or trust-driven platforms.`);
    case 'tiktok':
      if(personal) return visual
        ? strong(`Short-form video can introduce you to a completely new audience fast — especially if you can show, not just tell.`)
        : moderate(`TikTok can work for personal brands, but it favors entertainment and speed over depth. Treat it as an experiment, not your foundation.`);
      return visual
        ? strong(`TikTok's algorithm can hand ${brand.name} a huge new audience overnight if the product is fun to show on camera.`)
        : weak(`Without a naturally visual or entertaining product, TikTok content will feel forced for ${brand.name}. Effort is high, payoff is uncertain.`);
    case 'facebook':
      if(personal) return moderate(`Facebook's audience skews older and more local — useful if that matches your audience, but rarely where personal brands build initial authority.`);
      return (local || older)
        ? strong(`${brand.name}'s audience overlaps heavily with who's still active on Facebook — groups and local discovery are a real advantage here.`)
        : weak(`Facebook's audience skews older than ${brand.name}'s target customer. Time is likely better spent elsewhere.`);
    case 'pinterest':
      if(personal) return weak(`Pinterest is a visual search engine for products and ideas, not a place people go to follow individual experts. Low priority for a personal brand.`);
      return visual
        ? strong(`People use Pinterest to plan purchases, not just browse — strong for a visual brand like ${brand.name} with real buying intent.`)
        : weak(`Pinterest works best for physical, visual products. It's a poor match for ${brand.name}.`);
    case 'linkedin':
      if(personal) return strong(`LinkedIn is built for exactly what a personal brand needs: credibility, professional reach, and posts with a long shelf life.`);
      return b2b
        ? strong(`${brand.name} sells to other professionals — LinkedIn is where those buyers actually make decisions.`)
        : moderate(`LinkedIn can build credibility for ${brand.name}, but it's a slower, more professional audience than a typical consumer buyer.`);
    case 'twitter':
      if(personal) return strong(`X rewards sharp opinions and real-time conversation — ideal for building a reputation as someone worth listening to.`);
      return b2b
        ? moderate(`X can help ${brand.name} stay visible among industry peers, but it rarely drives direct sales on its own.`)
        : weak(`Fast-moving text conversation is a mismatch for a product like ${brand.name} that needs to be seen, not just discussed.`);
    case 'youtube':
      if(personal) return strong(`Long-form video builds trust faster than almost any other format — and it keeps working for years after you publish it.`);
      return moderate(`YouTube can build deep trust for ${brand.name} through tutorials or behind-the-scenes content, but it demands more time per post than any other platform.`);
    case 'newsletter':
      if(personal) return strong(`A newsletter is the one channel no algorithm can take away from you — essential for turning followers into a real audience.`);
      return strong(`No algorithm stands between ${brand.name} and its list. Owning that direct line is one of the highest-leverage moves available.`);
    default:
      return moderate('This platform could work — test it with a small content budget before committing.');
  }
}
function fitClass(verdict){ return verdict==='Strong fit' ? 'strong' : verdict==='Worth testing' ? 'moderate' : 'weak'; }
function fitValue(verdict){ return verdict==='Strong fit' ? 2 : verdict==='Worth testing' ? 1 : -1; }

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }

function computeGrowthReport(mode, brand, platforms, pillars, event, eventChoice){
  const platformFits = platforms.map(p=>({ ...p, fit:getPlatformFit(p.id, brand, mode) }));
  const platformScoreSum = platformFits.reduce((s,p)=> s + fitValue(p.fit.verdict), 0);
  const platformAvg = platforms.length ? platformScoreSum/platforms.length : 0;
  const buckets = new Set(pillars.map(p=>p.bucket));
  const bucketCount = buckets.size;
  const pillarScaled = -1 + (bucketCount-1)*1.5;
  const eventScore = eventChoice.score;
  const eventScaled = -1 + (eventScore+2)*(3/5);
  const total = platformScoreSum + bucketCount + eventScore;
  const percent = Math.max(6, Math.min(100, Math.round(((total+5)/17)*100)));
  let growthLabel;
  if(total>=9) growthLabel='Explosive 🚀';
  else if(total>=6) growthLabel='Strong 📈';
  else if(total>=3) growthLabel='Promising 🌱';
  else growthLabel='Needs Work 🔧';

  const bestPlatform = platformFits.slice().sort((a,b)=>fitValue(b.fit.verdict)-fitValue(a.fit.verdict))[0];
  const worstPlatform = platformFits.slice().sort((a,b)=>fitValue(a.fit.verdict)-fitValue(b.fit.verdict))[0];

  const cats = [
    { key:'platform', val:platformAvg,
      best:`Choosing ${platformFits.map(p=>p.name).join(' + ')} as your core channels was the strongest move here — ${bestPlatform.fit.reason}`,
      mistake:`Some of your platform choices are a stretch for this audience — ${worstPlatform.fit.reason}` },
    { key:'pillar', val:pillarScaled,
      best:`Building your content around ${pillars.map(p=>p.name).join(', ')} was the strongest move — those pillars cover ${bucketCount} different strategic angle${bucketCount>1?'s':''} (${[...buckets].join(', ')}), which keeps the content from feeling one-note.`,
      mistake: bucketCount<3
        ? `Your 3 pillars (${pillars.map(p=>p.name).join(', ')}) lean on similar goals — only ${bucketCount} strategic angle${bucketCount>1?'s':''} covered. Add more variety next round.`
        : `No real gap here — your pillar mix is already well balanced across authority, connection, and conversion.` },
    { key:'event', val:eventScaled,
      best:`How you handled "${event.title}" was the strongest move — choosing to ${eventChoice.label.toLowerCase()} paid off. ${eventChoice.consequence}`,
      mistake: eventScore<1
        ? `How you handled "${event.title}" cost you — choosing to ${eventChoice.label.toLowerCase()} backfired. ${eventChoice.consequence}`
        : `Your response to "${event.title}" held up fine — nothing major to flag here.` }
  ];
  const bestCat = cats.reduce((a,b)=> b.val>a.val ? b : a);
  const worstCat = cats.reduce((a,b)=> b.val<a.val ? b : a);

  const lessonsPool = mode==='personal' ? PERSONAL_LESSONS : BUSINESS_LESSONS;
  return {
    platformFits, pillars, growthLabel, percent, total,
    bestDecision: bestCat.best,
    biggestMistake: worstCat.mistake,
    lessons: pickN(lessonsPool,3),
    audienceText: `${brand.audience} ${brand.audienceDetail}`
  };
}

  return (
    <div className={`why-box ${kind}`}>
      <p className="wb-label">{icon} {title}</p>
      <p>{children}</p>
    </div>
  );
}

function AskClaudeCard({label, prompt, note}){
  const [copied, setCopied] = useState(false);
  const doCopy = () => {
    const finish = () => { setCopied(true); setTimeout(()=>setCopied(false), 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(prompt).then(finish).catch(finish);
    } else {
      finish();
    }
  };
  return (
    <div className="ask-claude">
      <div className="ask-claude-header">
        <span className="ac-dot"></span>
        <span>How to ask Claude — {label}</span>
      </div>
      <div className="ask-claude-body">
        <pre>{prompt}</pre>
        {note && <p className="ask-claude-note">{note}</p>}
        <button className="btn btn-outline btn-sm copy-btn" onClick={doCopy}>
          {copied ? '✓ Copied' : '⧉ Copy prompt'}
        </button>
      </div>
    </div>
  );
}

function ProgressTrack({stage}){
  return (
    <div className="progress-wrap">
      <div className="progress-track">
        {STAGES.map((s,i)=>(
          <div className="progress-node-wrap" key={i}>
            <div className={`progress-node ${i<stage?'done':i===stage?'current':''}`}>
              {i<stage ? '✓' : s.icon}
            </div>
            <div className={`progress-label ${i===stage?'active':''}`}>{s.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   STAGE: PLATFORMS
   ============================================================ */
function PlatformsStage({mode, brand, selected, setSelected, revealed, setRevealed, onContinue}){
  const toggle = (id) => {
    setSelected(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  };
  const canReveal = selected.length >= 2;
  const canContinue = revealed && selected.length >= 2;

  return (
    <div className="stage">
      <p className="eyebrow">Step 2 · Platform Strategy</p>
      <h1 className="title">Where should {brand.name} show up?</h1>
      <p className="lede">Pick the platforms you think fit best — based on the brief you just read — before seeing the analysis.</p>

      <div className="why-grid">
        <WhyBox title="What is this?" icon="◆" kind="what">
          Every platform has a different audience, format, and algorithm. Choosing platforms isn't about being everywhere — it's about matching the platform to the audience.
        </WhyBox>
        <WhyBox title="Why does it matter?" icon="◆" kind="why">
          Spreading effort across every platform equally is one of the most common beginner mistakes. Strategists pick 2–4 platforms deliberately and go deep, not wide.
        </WhyBox>
      </div>

      <div className="platform-grid">
        {PLATFORMS.map(p=>{
          const isSel = selected.includes(p.id);
          const fit = revealed ? getPlatformFit(p.id, brand, mode) : null;
          return (
            <div key={p.id} className={`platform-card ${isSel?'selected':''}`} onClick={()=>toggle(p.id)}>
              <div className="pc-top">
                <div className="pc-name">{p.icon} {p.name}</div>
                <div className="pc-check">✓</div>
              </div>
              <p className="pc-summary">{p.summary}</p>
              {fit && (
                <React.Fragment>
                  <span className={`fit-badge ${fitClass(fit.verdict)}`}>{fit.verdict}</span>
                  <p className="fit-reason">{fit.reason}</p>
                </React.Fragment>
              )}
            </div>
          );
        })}
      </div>

      <div className="actions-row">
        {!revealed && (
          <button className="btn btn-outline" disabled={!canReveal} onClick={()=>setRevealed(true)}>
            {canReveal ? 'Reveal Strategy Fit →' : 'Select at least 2 platforms'}
          </button>
        )}
        {revealed && (
          <button className="btn btn-primary" disabled={!canContinue} onClick={onContinue}>Choose Content Pillars →</button>
        )}
      </div>

      {revealed && (
        <AskClaudeCard
          label="Choose platforms"
          prompt={mode==='personal'
            ? `I'm building a personal brand as ${brand.name} in "${brand.niche}". Should I prioritize LinkedIn, X, YouTube, or a newsletter first, and why?`
            : `I'm choosing marketing platforms for ${brand.name}, a ${brand.industryLabel} targeting: ${brand.audience}\n\nI'm considering: ${PLATFORMS.map(p=>p.name).join(', ')}. Which platforms should I prioritize first and why?`}
        />
      )}
    </div>
  );
}

/* ============================================================
   STAGE: PILLARS
   ============================================================ */
function PillarsStage({mode, brand, options, selectedIds, setSelectedIds, onContinue}){
  const toggle = (id) => {
    setSelectedIds(prev => {
      if(prev.includes(id)) return prev.filter(x=>x!==id);
      if(prev.length>=3) return prev;
      return [...prev, id];
    });
  };
  const selectedPillars = options.filter(p=>selectedIds.includes(p.id));

  return (
    <div className="stage">
      <p className="eyebrow">Step 3 · Content Pillars</p>
      <h1 className="title">Pick exactly 3 content pillars</h1>
      <p className="lede">Pillars are recurring themes, not individual posts. Choose 3 that together cover more than one goal.</p>

      <div className="why-grid">
        <WhyBox title="What is this?" icon="◆" kind="what">
          A content pillar is a repeatable topic bucket — something you can return to constantly without running out of ideas.
        </WhyBox>
        <WhyBox title="Why does it matter?" icon="◆" kind="why">
          Posting randomly produces inconsistent results. Pillars give structure so every post serves a purpose — awareness, trust, or sales.
        </WhyBox>
      </div>

      <div className="pillar-grid">
        {options.map((p,i)=>{
          const isSel = selectedIds.includes(p.id);
          const disabled = !isSel && selectedIds.length>=3;
          return (
            <div key={p.id} className={`pillar-card ${isSel?'selected':''} ${disabled?'disabled':''}`} onClick={()=>!disabled && toggle(p.id)}>
              <span className="pnum">0{i+1}</span>
              <h4>{p.name}</h4>
              <p>{p.desc}</p>
              {isSel && <span className="goal-tag">{p.goal}</span>}
            </div>
          );
        })}
      </div>
      <p className="pillar-select-count"><b>{selectedIds.length}/3</b> pillars selected</p>

      <div className="actions-row">
        <button className="btn btn-primary" disabled={selectedIds.length!==3} onClick={onContinue}>Build the Roadmap →</button>
      </div>

      {selectedIds.length===3 && (
        <AskClaudeCard
          label="Generate content ideas"
          prompt={`Give me 10 content ideas for ${brand.name} under the pillar "${selectedPillars[0].name}", aimed at: ${brand.audience}`}
          note="Repeat this prompt once per pillar to build out a real content bank."
        />
      )}
    </div>
  );
}

/* ============================================================
   STAGE: ROADMAP
   ============================================================ */
function RoadmapStage({mode, brand, pillars, platforms, onContinue}){
  const roadmap = useMemo(()=>buildRoadmap(mode, brand, pillars, platforms), [mode, brand, pillars, platforms]);
  const platformNames = platforms.map(p=>p.name).join(', ');
  const pillarNames = pillars.map(p=>p.name).join(', ');

  return (
    <div className="stage">
      <p className="eyebrow">Step 4 · 30-Day Roadmap</p>
      <h1 className="title">The first 30 days</h1>
      <p className="lede">A roadmap shows weekly goals and strategy shifts — not a list of individual posts. That level of detail comes later.</p>

      <div className="why-grid">
        <WhyBox title="What is this?" icon="◆" kind="what">
          A phased plan: what you're trying to accomplish each week, and why that order makes sense.
        </WhyBox>
        <WhyBox title="Why does it matter?" icon="◆" kind="why">
          Strategy has a sequence. Trying to sell before you've built trust — or building trust forever without ever asking for the sale — both fail for predictable reasons.
        </WhyBox>
      </div>

      <div className="roadmap-grid">
        {roadmap.map(w=>(
          <div className="week-card" key={w.week}>
            <div className="week-num">{w.week}<span>week</span></div>
            <div className="week-body">

              <p className="week-goal">{w.goal}</p>

        <button className="btn btn-primary" onClick={onContinue}>Handle a Curveball →</button>
      </div>

      <AskClaudeCard
        label="Turn a week into posts"
        prompt={`Turn Week 2 of this roadmap into 5 specific post ideas for ${platformNames}, mixing these pillars: ${pillarNames}.`}
      />
    </div>
  );

/* ============================================================
   STAGE: EVENT
   ============================================================ */
function EventStage({mode, brand, event, setEvent, choiceIdx, setChoiceIdx, onContinue}){
  useEffect(()=>{
    if(!event){
      const pool = mode==='personal' ? PERSONAL_EVENTS : BUSINESS_EVENTS;
      setEvent(rand(pool));
    }
  }, [event, mode]);

  if(!event) return <div className="stage"><p style={{color:'var(--text-dim)'}}>Loading today's curveball…</p></div>;

  const chosen = choiceIdx!==null ? event.options[choiceIdx] : null;

  return (
    <div className="stage">
      <p className="eyebrow">Step 5 · The Curveball</p>
      <h1 className="title">Something unexpected happens</h1>
      <p className="lede">No plan survives contact with the real world. How you respond in the moment is its own strategic decision.</p>

      <div className="why-grid">
        <WhyBox title="What is this?" icon="◆" kind="what">
          A random event that disrupts the plan — good or bad. You'll choose how to respond and see the consequence.
        </WhyBox>
        <WhyBox title="Why does it matter?" icon="◆" kind="why">
          Strategists are judged as much by how they react to surprises as by the original plan. Some reactions compound growth; others quietly undo it.
        </WhyBox>
      </div>

      <div className="event-card">
        <p className="event-title">{event.icon} {event.title}</p>
        <p className="event-desc">{event.description(brand)}</p>
        <div className="option-list">
          {event.options.map((opt,i)=>(
            <button
              key={i}
              className={`option-btn ${choiceIdx===i?'chosen':''}`}
              disabled={choiceIdx!==null}
              onClick={()=>setChoiceIdx(i)}
            >{opt.label}</button>
          ))}
        </div>
        {chosen && (
          <div className="consequence-box">
            <p className="cb-label">What happens next</p>
            <p>{chosen.consequence}</p>
          </div>
        )}
      </div>

      {chosen && (
        <React.Fragment>
          <div className="actions-row">
            <button className="btn btn-primary" onClick={onContinue}>See the Growth Report →</button>
          </div>
          <AskClaudeCard
            label="Draft a real response"
            prompt={`"${event.title}" just happened to ${brand.name}. Draft 3 different ways I could publicly respond, and explain the trade-offs of each.`}
          />
        </React.Fragment>
      )}
    </div>
  );
}

      <div className="report-grid">
        <div className="report-card full">
          <p className="rc-label">Audience Understanding</p>
          <p>{report.audienceText}</p>

          <p className="rc-label">Platform Strategy</p>
          <ul>
            {report.platformFits.map(p=>(
              <li key={p.id}><b style={{color:'var(--text)'}}>{p.name}</b> — {p.fit.verdict}: {p.fit.reason}</li>
            ))}
          </ul>
        </div>

        <div className="report-card">
          <p className="rc-label">Content Strategy</p>
          <ul>
            {report.pillars.map(p=>(
              <li key={p.id}><b style={{color:'var(--text)'}}>{p.name}</b> — {p.goal}</li>
            ))}
          </ul>
        </div>

        <div className="report-card full">
          <p className="rc-label">Growth Potential</p>
          <div className="growth-label">{report.growthLabel}</div>
          <div className="meter"><div className="meter-fill" style={{width:barWidth+'%'}}></div></div>
        </div>

        <div className="report-card best-card">
          <p className="rc-label">✓ Best Decision</p>
          <p>{report.bestDecision}</p>
        </div>

        <div className="report-card mistake-card">
          <p className="rc-label">✕ Biggest Mistake</p>
          <p>{report.biggestMistake}</p>
        </div>

        <div className="report-card full">
          <p className="rc-label">Three Marketing Lessons</p>
          <ul className="lessons-list" style={{marginTop:8}}>
            {report.lessons.map((l,i)=>(
              <li key={i}><span className="lnum">0{i+1}</span><span>{l}</span></li>
            ))}
          </ul>
        </div>
      </div>

      <div className="actions-row">
        <button className="btn btn-primary" onClick={onRestart}>🔁 Start a New Campaign</button>
      </div>

      <AskClaudeCard
        label="Plan month two"
        prompt={`Here's my growth report for ${brand.name}:\n- Audience: ${report.audienceText}\n- Platforms: ${report.platformFits.map(p=>p.name).join(', ')}\n- Pillars: ${report.pillars.map(p=>p.name).join(', ')}\n- Biggest mistake: ${report.biggestMistake}\n\nBased on this, build me a 30-day plan for month two that fixes my biggest weakness.`}
      />
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [stage, setStage] = useState(0);
  const [mode, setMode] = useState(null);
  const [brand, setBrand] = useState(null);
  const [selectedPlatformIds, setSelectedPlatformIds] = useState([]);
  const [platformRevealed, setPlatformRevealed] = useState(false);
  const [pillarOptions, setPillarOptions] = useState([]);
  const [selectedPillarIds, setSelectedPillarIds] = useState([]);
  const [event, setEvent] = useState(null);
  const [eventChoiceIdx, setEventChoiceIdx] = useState(null);

  useEffect(()=>{
    if(stage===3 && brand && pillarOptions.length===0){
      const pool = mode==='personal' ? PERSONAL_PILLARS : BUSINESS_PILLARS;
      setPillarOptions(pickN(pool, Math.min(6, pool.length)));
    }
  }, [stage, brand, mode]);

  const restart = () => {
    setStage(0); setMode(null); setBrand(null);
    setSelectedPlatformIds([]); setPlatformRevealed(false);
    setPillarOptions([]); setSelectedPillarIds([]);
    setEvent(null); setEventChoiceIdx(null);
  };

  const chooseMode = (m) => { setMode(m); setBrand(null); setStage(1); };

  const selectedPlatforms = PLATFORMS.filter(p=>selectedPlatformIds.includes(p.id));
  const selectedPillars = pillarOptions.filter(p=>selectedPillarIds.includes(p.id));

  return (
    <div className="app">
      <div className="topbar">
        <div className="brandmark">
          <span className="dot"></span>
          <span className="brandmark-text">Grow This Brand</span>
        </div>
        {stage>0 && <button className="restart-btn" onClick={restart}>↺ Start Over</button>}
      </div>

      <ProgressTrack stage={stage} />

      {stage===0 && <WelcomeStage onChoose={chooseMode} />}

      {stage===1 && mode && (
        <BriefStage mode={mode} brand={brand} setBrand={setBrand} onContinue={()=>setStage(2)} />
      )}

      {stage===2 && brand && (
        <PlatformsStage
          mode={mode} brand={brand}
          selected={selectedPlatformIds} setSelected={setSelectedPlatformIds}
          revealed={platformRevealed} setRevealed={setPlatformRevealed}
          onContinue={()=>setStage(3)}
        />
      )}

      {stage===3 && brand && pillarOptions.length>0 && (
        <PillarsStage
          mode={mode} brand={brand} options={pillarOptions}
          selectedIds={selectedPillarIds} setSelectedIds={setSelectedPillarIds}
          onContinue={()=>setStage(4)}
        />
      )}

      {stage===4 && brand && (
        <RoadmapStage mode={mode} brand={brand} pillars={selectedPillars} platforms={selectedPlatforms} onContinue={()=>setStage(5)} />
      )}

      {stage===5 && brand && (
        <EventStage
          mode={mode} brand={brand} event={event} setEvent={setEvent}
          choiceIdx={eventChoiceIdx} setChoiceIdx={setEventChoiceIdx}
          onContinue={()=>setStage(6)}
        />
      )}

      {stage===6 && brand && event && eventChoiceIdx!==null && (
        <ReportStage
          mode={mode} brand={brand} platforms={selectedPlatforms} pillars={selectedPillars}
          event={event} eventChoice={event.options[eventChoiceIdx]}
          onRestart={restart}
        />
      )}

      <small className="foot">Think Like a Marketing Strategist — a replayable strategy simulator</small>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
